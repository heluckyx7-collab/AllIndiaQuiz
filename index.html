<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Free Quiz - CBSE, State Boards & Exams</title>
    <meta name="description" content="Free quiz for CBSE, State Boards and Indian exams. Hindi & English. Select book, subject and number of questions.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Left Side Ad -->
    <div class="ad-sidebar left-ad">
        <div class="ad-box">
            <p>Advertisement</p>
            <div class="ad-placeholder"><span>Ad Space<br>300x600</span></div>
        </div>
    </div>

    <div class="main-container">
        <header>
            <h1>🇮🇳 All India Free Quiz</h1>
            <p class="tagline">CBSE • State Boards • JEE • NEET • SSC • Free Forever</p>
            <p class="free-badge">💯 Free • Hindi + English • Side Ads Only</p>
        </header>

        <!-- HOME / SELECTION SCREEN -->
        <div id="home-screen">
            <div class="selection-card">
                <h2>Quiz Setup</h2>

                <!-- Language -->
                <div class="form-group">
                    <label>Language / भाषा</label>
                    <div class="btn-group" id="lang-group">
                        <button class="select-btn active" data-value="hindi" onclick="selectOption(this, 'language')">हिंदी</button>
                        <button class="select-btn" data-value="english" onclick="selectOption(this, 'language')">English</button>
                        <button class="select-btn" data-value="both" onclick="selectOption(this, 'language')">Both</button>
                    </div>
                </div>

                <!-- Board / Book -->
                <div class="form-group">
                    <label>Board / Book</label>
                    <select id="board-select" class="form-select">
                        <option value="cbse">CBSE (NCERT)</option>
                        <option value="state">State Board (Common)</option>
                        <option value="jee">JEE Main</option>
                        <option value="neet">NEET</option>
                        <option value="ssc">SSC / Competitive</option>
                    </select>
                </div>

                <!-- Subject -->
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subject-select" class="form-select">
                        <option value="maths">Mathematics / गणित</option>
                        <option value="science">Science / विज्ञान</option>
                        <option value="gk">General Knowledge</option>
                        <option value="physics">Physics</option>
                        <option value="biology">Biology</option>
                    </select>
                </div>

                <!-- Number of Questions -->
                <div class="form-group">
                    <label>Number of Questions</label>
                    <div class="btn-group" id="count-group">
                        <button class="select-btn" data-value="5" onclick="selectOption(this, 'count')">5</button>
                        <button class="select-btn active" data-value="10" onclick="selectOption(this, 'count')">10</button>
                        <button class="select-btn" data-value="15" onclick="selectOption(this, 'count')">15</button>
                        <button class="select-btn" data-value="20" onclick="selectOption(this, 'count')">20</button>
                    </div>
                </div>

                <button class="btn primary full-width" onclick="startQuiz()">Start Quiz →</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <button class="back-btn" onclick="goHome()">← Home</button>
                <div class="progress-info">
                    <span id="question-counter">Q 1/10</span>
                    <span id="score-display">Score: 0</span>
                </div>
            </div>
            <div class="progress-bar"><div id="progress-fill"></div></div>

            <div id="question-box" class="question-box">
                <h3 id="question-text"></h3>
                <div id="options-container"></div>
            </div>

            <div id="explanation-box" class="explanation-box hidden">
                <h4 id="result-title"></h4>
                <p id="explanation-text"></p>
                <button id="next-btn" class="btn primary" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <div class="result-card">
                <h2>🎉 Quiz Complete!</h2>
                <div class="score-circle"><span id="final-score">0</span></div>
                <p id="result-message"></p>
                <div class="result-buttons">
                    <button class="btn primary" onclick="restartQuiz()">Try Again</button>
                    <button class="btn secondary" onclick="goHome()">Home</button>
                </div>
            </div>
        </div>

        <footer>
            <p>Free for Indian Students • Only Side Ads • No Paid Content</p>
        </footer>
    </div>

    <!-- Right Side Ad -->
    <div class="ad-sidebar right-ad">
        <div class="ad-box">
            <p>Advertisement</p>
            <div class="ad-placeholder"><span>Ad Space<br>300x600</span></div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
